<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="plate" x1="12" y1="8" x2="116" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#343b43"/>
      <stop offset="0.48" stop-color="#171c21"/>
      <stop offset="1" stop-color="#2a3138"/>
    </linearGradient>
    <linearGradient id="steel" x1="22" y1="35" x2="108" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f9fa"/>
      <stop offset="0.22" stop-color="#aeb7bf"/>
      <stop offset="0.48" stop-color="#eef1f3"/>
      <stop offset="0.72" stop-color="#7e8993"/>
      <stop offset="1" stop-color="#d9dee2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="25" fill="url(#plate)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="24.25"
        fill="none" stroke="#c7cdd2" stroke-opacity=".34" stroke-width="1.5"/>
  <path d="M19 17h90M15 108h98" stroke="#fff" stroke-opacity=".055"/>

  <g transform="translate(5 32) scale(.49)" fill="url(#steel)" stroke="url(#steel)" filter="url(#shadow)">
    <!-- Broken-stem D, matching the supplied department mark. -->
    <path d="M18 34h38c20 0 31 12 31 31S76 97 56 97H18V55"
          fill="none" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round"/>

    <!-- F shares the visual axis with the D crossbar. -->
    <path d="M93 96V78M93 59v-6c0-13 8-19 22-19h43M82 68h72"
          fill="none" stroke-width="16" stroke-linecap="butt" stroke-linejoin="round"/>

    <!-- Descending arm of X. -->
    <path d="M160 29h20l47 68h-20z" stroke="none"/>

    <!-- Rising arm of X continues into the lower orbital sweep. -->
    <path d="M45 104c51 22 126-8 170-75h17c-48 79-128 108-184 83z" stroke="none"/>

    <!-- Upper tapered orbit from the original mark. -->
    <path d="M94 28c41-24 99-22 112 8 4 9 4 18 1 25 0-34-50-47-103-27z" stroke="none"/>
  </g>
</svg>
